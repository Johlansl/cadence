server {
    listen 80;
    server_name _;

    # Don't advertise the nginx version (Server header, error pages). Caddy in
    # front strips Server entirely; this is defence in depth.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # API calls are proxied to the backend service on the compose network,
    # so the browser only ever talks to this origin (no CORS).
    #
    # Resolve `backend` at request time via Docker's embedded DNS (127.0.0.11),
    # not just once at startup -- otherwise recreating the backend container
    # (new IP) leaves nginx proxying to a dead address until it is restarted.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cadence_backend http://backend:8000;
        proxy_pass $cadence_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite -> safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
