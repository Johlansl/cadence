# Cadence CI: lint/test the three components on every push.

stages:
  - test

agent:
  stage: test
  image: golang:1.23
  script:
    - cd agent
    - go vet ./...
    - go test ./...
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/cadence-agent ./cmd/agent
    - ./bin/cadence-agent -version
    - (cd bin && sha256sum cadence-agent > cadence-agent.sha256)
  artifacts:
    name: cadence-agent
    paths:
      - agent/bin/cadence-agent
      - agent/bin/cadence-agent.sha256
    expire_in: 30 days

scripts:
  stage: test
  image:
    name: koalaman/shellcheck-alpine:stable
    entrypoint: [""]
  script:
    - shellcheck --version
    - shellcheck scripts/*.sh caddy/*.sh
    # the caddy entrypoint must reject a hash whose `$` were eaten by compose,
    # and an empty hash when auth is on (the positive path is covered by `stack`)
    - |
      if CADENCE_DASHBOARD_AUTH=on CADENCE_DASHBOARD_PASSWORD_HASH=2a14brokenhash sh caddy/entrypoint.sh true; then
        echo "FAIL: entrypoint accepted a mangled hash"; exit 1
      fi
      if CADENCE_DASHBOARD_AUTH=on CADENCE_DASHBOARD_PASSWORD_HASH= sh caddy/entrypoint.sh true; then
        echo "FAIL: entrypoint accepted an empty hash with auth on"; exit 1
      fi
      if ! CADENCE_DASHBOARD_AUTH=off sh caddy/entrypoint.sh true; then
        echo "FAIL: entrypoint should skip the check when auth is off"; exit 1
      fi
      echo "entrypoint validation checks OK"

backend:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16
      alias: postgres
  variables:
    # consumed by the postgres service and by the app / test config
    POSTGRES_USER: cadence
    POSTGRES_PASSWORD: cadence
    POSTGRES_DB: cadence
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_HOST: postgres
    CADENCE_ADMIN_KEY: ci-admin-key
    PIP_NO_CACHE_DIR: "1"
  script:
    - pip install -r backend/requirements-dev.txt
    - cd backend && pytest -q

stack:
  # Smoke-test the whole docker-compose stack from a clean state: build the
  # images, bring everything up, and assert it converges. Catches broken
  # Dockerfiles and schema/migration bootstrap regressions the unit suites
  # (which build the DB from Alembic directly) cannot see.
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  timeout: 15m
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - docker compose version || apk add --no-cache docker-cli-compose
    - |
      cat > .env <<'EOF'
      POSTGRES_USER=cadence
      POSTGRES_PASSWORD=cadence-ci
      POSTGRES_DB=cadence
      CADENCE_ADMIN_KEY=ci-admin-key-0123456789abcdef
      CADENCE_SITE_ADDRESS=cadence.ci.local
      CADENCE_DASHBOARD_AUTH=on
      CADENCE_DASHBOARD_USER=cadence
      CADENCE_DASHBOARD_PASSWORD_HASH=$$2a$$14$$9RzS8dzkDp0vCxfkusQZR.1l95oLIGKbReMUMdZwJ77Dz9SNKXqra
      CADENCE_ADVISORY_REFRESH_ENABLED=false
      EOF
    - mkdir -p dist   # caddy bind-mounts ./dist (gitignored, absent in CI)
  script:
    - docker compose up -d --build --wait --wait-timeout 240
    - docker compose ps
    - docker compose run --rm backend alembic current
    # assert the stack booted and ran its migrations to head (any revision)
    - docker compose run --rm backend alembic current | grep -qE ' \(head\)$'
    - docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5); print('readyz ok')"
    # basic-auth gate (the placeholder hash above is bcrypt of "change-me")
    - 'test "$(docker compose exec -T caddy sh -c ''curl -sk -o /dev/null -w "%{http_code}" --resolve cadence.ci.local:443:127.0.0.1 https://cadence.ci.local/'')" = 401'
    - 'test "$(docker compose exec -T caddy sh -c ''curl -sk -o /dev/null -w "%{http_code}" -u cadence:change-me --resolve cadence.ci.local:443:127.0.0.1 https://cadence.ci.local/'')" = 200'
    # agent endpoints must NOT be gated: the response must not carry a basic-auth challenge
    - |
      if docker compose exec -T caddy sh -c 'curl -sk -D - -o /dev/null -X POST --resolve cadence.ci.local:443:127.0.0.1 https://cadence.ci.local/api/v1/agent/next-job' | grep -qi '^www-authenticate:.*basic'; then
        echo "FAIL: /api/v1/agent/next-job is behind basic auth"; exit 1
      fi
    # security headers on the dashboard response
    - |
      H=$(docker compose exec -T caddy sh -c 'curl -sk -D - -o /dev/null -u cadence:change-me --resolve cadence.ci.local:443:127.0.0.1 https://cadence.ci.local/')
      for want in \
        '^x-content-type-options: nosniff' \
        '^x-frame-options: DENY' \
        '^referrer-policy: no-referrer' \
        '^content-security-policy: .*frame-ancestors'; do
        echo "$H" | grep -qi "$want" || { echo "FAIL: missing header matching /$want/"; echo "$H"; exit 1; }
      done
      if echo "$H" | grep -qi '^server:'; then echo "FAIL: Server header leaked:"; echo "$H" | grep -i '^server:'; exit 1; fi
  after_script:
    - docker compose logs --tail=80 || true
    - docker compose down -v || true

frontend:
  stage: test
  image: node:22-alpine
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm-cache/
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm test
    - npm run build
