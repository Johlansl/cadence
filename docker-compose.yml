# Cadence central server -- docker-compose: db + backend + frontend.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Schema applied on first startup, on an empty data volume.
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback only -- convenience for a local psql client.
      # `docker compose exec db psql ...` works without this mapping.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CADENCE_ADMIN_KEY: ${CADENCE_ADMIN_KEY}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Interface is configurable: 127.0.0.1 (default) for a local test,
      # 0.0.0.0 to reach the API from other VMs. See CADENCE_BACKEND_BIND.
      - "${CADENCE_BACKEND_BIND:-127.0.0.1}:8000:8000"

  scheduler:
    # Same image as the backend, different entrypoint: a plain loop that turns
    # due `schedules` rows into `jobs` rows. No ports -- it only touches the DB.
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CADENCE_ADMIN_KEY: ${CADENCE_ADMIN_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.scheduler"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Plain-HTTP dashboard. Loopback by default now that Caddy fronts it;
      # set CADENCE_FRONTEND_BIND=0.0.0.0 only to reach it without TLS.
      - "${CADENCE_FRONTEND_BIND:-127.0.0.1}:8080:80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADENCE_SITE_ADDRESS: ${CADENCE_SITE_ADDRESS}
    depends_on:
      - frontend
    ports:
      # The public entrypoint. CADENCE_HTTP_BIND controls the interface
      # (0.0.0.0 to serve the LAN). 80 redirects to 443.
      - "${CADENCE_HTTP_BIND:-0.0.0.0}:80:80"
      - "${CADENCE_HTTP_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist the internal CA + issued certs across restarts.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
