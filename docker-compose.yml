# Cadence central server -- docker-compose.
#
# Increment 2 (see CLAUDE.md section 8): `db` + `backend`. The `frontend`
# service is added in increment 6.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Schema applied on first startup, on an empty data volume.
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback only -- convenience for a local psql client.
      # `docker compose exec db psql ...` works without this mapping.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CADENCE_ADMIN_KEY: ${CADENCE_ADMIN_KEY}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Interface is configurable: 127.0.0.1 (default) for a local test,
      # 0.0.0.0 to reach the API from other VMs. See CADENCE_BACKEND_BIND.
      - "${CADENCE_BACKEND_BIND:-127.0.0.1}:8000:8000"

volumes:
  pgdata:
