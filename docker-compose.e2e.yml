# E2E overrides: the test stack runs as `docker compose -p e2e` next to a
# production or dev stack without colliding with it. Used only by
# scripts/test-agent-upgrade-e2e.sh.
#
# Ports: container-side ports (and therefore all in-network URLs, including
# the agent's https://caddy:8443) are unchanged; only the loopback mappings
# move. `!override` REPLACES each base ports list (a plain list would merge
# and keep binding the production ports too).
#
# Images: the base file gives backend and scheduler the explicit name
# `cadence-backend`, which the project name does not prefix, so a plain
# `up --build` here would move the production tag. Both are renamed
# `e2e-backend`. (frontend has no explicit name: compose calls it e2e-frontend.)
# Volumes and the network carry the project prefix already (e2e_*).
services:
  db:
    ports: !override
      - "127.0.0.1:5433:5432"
  backend:
    image: e2e-backend
    ports: !override
      - "127.0.0.1:8001:8000"
  scheduler:
    image: e2e-backend
  frontend:
    ports: !override
      - "127.0.0.1:8081:80"
  caddy:
    ports: !override
      - "127.0.0.1:8082:80"
      - "127.0.0.1:4443:443"
      - "127.0.0.1:8444:8443"
