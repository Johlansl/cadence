# nfpm spec for the Cadence agent .deb (built by .github/workflows/release.yml
# on an agent-v* tag). ARCH and VER are passed as env vars; the arch binary is
# staged to ./stage/cadence-agent and the systemd units are copied to ./units/
# with /usr/local -> /usr paths by the workflow step before nfpm runs.
#
# Unsigned on purpose: no long-lived signing key in CI (see docs/decisions.md
# "Release automation"). Provenance is the Sigstore attestation on the file.

name: cadence-agent
arch: ${ARCH}
platform: linux
version: ${VER}
version_schema: semver
release: "1"

section: admin
priority: optional
maintainer: Johlansl <noreply@github.com>
homepage: https://github.com/Johlansl/cadence
license: Apache-2.0
description: |
  Cadence patch-management agent.
  A stdlib-only Go binary run by systemd timers: it reports installed packages
  and available apt updates to a Cadence server, and runs apt dist-upgrade /
  reboot jobs the server queues. Debian/Ubuntu only (uses apt and dpkg).

# No hard dependency: the payload is a static binary plus unit files and an
# example config. systemd is the assumed runtime (the maintainer scripts guard
# on /run/systemd/system) but the package must still install in a minimal
# chroot/container. The reboot-required helper only improves reboot detection.
recommends:
  - reboot-notifier | update-notifier-common

contents:
  - src: ./dist/stage/cadence-agent
    dst: /usr/bin/cadence-agent
    file_info:
      mode: 0755

  - src: ./dist/units/cadence-agent.service
    dst: /usr/lib/systemd/system/cadence-agent.service
    file_info:
      mode: 0644
  - src: ./dist/units/cadence-agent.timer
    dst: /usr/lib/systemd/system/cadence-agent.timer
    file_info:
      mode: 0644
  - src: ./dist/units/cadence-agent-poll.service
    dst: /usr/lib/systemd/system/cadence-agent-poll.service
    file_info:
      mode: 0644
  - src: ./dist/units/cadence-agent-poll.timer
    dst: /usr/lib/systemd/system/cadence-agent-poll.timer
    file_info:
      mode: 0644
  - src: ./dist/units/cadence-agent-health-check-boot.service
    dst: /usr/lib/systemd/system/cadence-agent-health-check-boot.service
    file_info:
      mode: 0644
  - src: ./dist/units/cadence-agent-health-check-boot.timer
    dst: /usr/lib/systemd/system/cadence-agent-health-check-boot.timer
    file_info:
      mode: 0644

  - src: ./agent/systemd/agent.env.example
    dst: /usr/share/doc/cadence-agent/agent.env.example
    file_info:
      mode: 0644
  - src: ./packaging/copyright
    dst: /usr/share/doc/cadence-agent/copyright
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove: ./packaging/preremove.sh
