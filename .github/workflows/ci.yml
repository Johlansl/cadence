name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same ref cancels the in-flight run. Safe for every job
# here (no external state; `stack` teardown is `if: always()`). NOTE: unlike
# release.yml, which deliberately keeps cancel-in-progress: false.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lint + test the three components (agent / backend / frontend), lint the
# shell scripts, and smoke-test the full docker compose stack from a clean
# state. Each job is path-filtered via the `changes` job below; `gate` is the
# single job to mark as a required status check (a skipped component job keeps
# `gate` green, a failed one fails it). Mirror of .gitlab-ci.yml -- keep the
# two in sync (MAINTAINING.md).

jobs:
  # Decide which component jobs need to run. Binary behaviour: either the exact
  # changed-file set over the whole push/PR range is known, or every component
  # is declared changed and the full matrix runs. No partial fallback.
  changes:
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.f.outputs.agent }}
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      scripts: ${{ steps.f.outputs.scripts }}
      stack: ${{ steps.f.outputs.stack }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history so base+head are always present
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -u
          all_changed() {
            {
              echo "agent=true"; echo "backend=true"; echo "frontend=true"
              echo "scripts=true"; echo "stack=true"
            } >> "$GITHUB_OUTPUT"
            echo "changes: range undetermined -> running the full matrix"
            exit 0
          }

          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push)         base="$PUSH_BEFORE"; head="$PUSH_AFTER" ;;
            *)            all_changed ;;
          esac
          [ -n "$base" ] && [ -n "$head" ] || all_changed
          case "$base" in *[!0]*) : ;; *) all_changed ;; esac   # all-zero / empty base
          git cat-file -e "${base}^{commit}" 2>/dev/null || all_changed
          git cat-file -e "${head}^{commit}" 2>/dev/null || all_changed

          # push: diff the two endpoints. pull_request: three-dot (merge-base..head)
          # so a moved target branch does not pull in unrelated files.
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "${base}...${head}") || all_changed
          else
            files=$(git diff --name-only "${base}" "${head}") || all_changed
          fi
          printf 'changed files:\n%s\n' "$files"

          match() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          {
            echo "agent=$(match '^agent/|^backend/app/api/deps\.py$|^backend/app/schemas/schemas\.py$|^docs/decisions\.md$|^\.github/workflows/ci\.yml$')"
            echo "backend=$(match '^backend/|^agent/internal/report/|^agent/internal/client/|^docs/decisions\.md$|^\.github/workflows/ci\.yml$')"
            echo "frontend=$(match '^frontend/|^\.github/workflows/ci\.yml$')"
            echo "scripts=$(match '^scripts/|^caddy/|^packaging/.*\.sh$|^\.github/workflows/ci\.yml$')"
            echo "stack=$(match '^docker-compose\.yml$|^Caddyfile$|^caddy/|^backend/|^frontend/|^\.env\.example$|^\.github/workflows/ci\.yml$')"
          } >> "$GITHUB_OUTPUT"

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: agent/go.mod # stdlib-only, empty go.sum
      - name: golangci-lint
        run: >-
          docker run --rm -v "$PWD/agent":/w -w /w
          golangci/golangci-lint:v2.13.2@sha256:ba07dffad130794ae79ebaa0056809d18c0168f3f846480ffd3eb6c04578b83d
          golangci-lint run ./...
      - working-directory: agent
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/cadence-agent ./cmd/agent
          ./bin/cadence-agent -version
          (cd bin && sha256sum cadence-agent > cadence-agent.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cadence-agent
          path: |
            agent/bin/cadence-agent
            agent/bin/cadence-agent.sha256
          retention-days: 30

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck --version && shellcheck scripts/*.sh caddy/*.sh packaging/*.sh
      - name: caddy entrypoint rejects a broken dashboard hash
        run: |
          if CADENCE_DASHBOARD_AUTH=on CADENCE_DASHBOARD_PASSWORD_HASH=2a14brokenhash sh caddy/entrypoint.sh true; then
            echo "FAIL: entrypoint accepted a mangled hash"; exit 1
          fi
          if CADENCE_DASHBOARD_AUTH=on CADENCE_DASHBOARD_PASSWORD_HASH= sh caddy/entrypoint.sh true; then
            echo "FAIL: entrypoint accepted an empty hash with auth on"; exit 1
          fi
          if ! CADENCE_DASHBOARD_AUTH=off sh caddy/entrypoint.sh true; then
            echo "FAIL: entrypoint should skip the check when auth is off"; exit 1
          fi
          echo "entrypoint validation checks OK"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadence"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence
      POSTGRES_HOST: localhost
      CADENCE_ADMIN_KEY: ci-admin-key-01
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - working-directory: backend
        run: ruff check .
      - working-directory: backend
        run: pytest -q
      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements-dev.txt

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: npm audit (non-blocking)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  stack:
    # Whole docker-compose stack from a clean state: build, bring up, assert it
    # converges. Catches broken Dockerfiles and migration bootstrap regressions
    # the unit suites (which build the DB from Alembic directly) cannot see.
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: write CI .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=cadence
          POSTGRES_PASSWORD=cadence-ci
          POSTGRES_DB=cadence
          CADENCE_ADMIN_KEY=ci-admin-key-0123456789abcdef
          CADENCE_TOKEN_ENCRYPTION_KEY=9-_VPVQlom8pTYO4akOJgl62acDbmu83HjzWCZTsAmU=
          CADENCE_SITE_ADDRESS=cadence.ci.local
          CADENCE_INTERNAL_PROXY_KEY=ci-internal-proxy-key-0123456789abcdef
          CADENCE_LEGACY_AGENT_ENDPOINTS=off
          CADENCE_DASHBOARD_AUTH=on
          CADENCE_DASHBOARD_USER=cadence
          CADENCE_DASHBOARD_PASSWORD_HASH=$$2a$$14$$9RzS8dzkDp0vCxfkusQZR.1l95oLIGKbReMUMdZwJ77Dz9SNKXqra
          CADENCE_ADVISORY_REFRESH_ENABLED=false
          EOF
          mkdir -p dist   # caddy bind-mounts ./dist (gitignored, absent in CI)
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: docker compose ps
      # assert the stack booted and ran its migrations to head (any revision)
      - run: docker compose run --rm backend alembic current | grep -qE ' \(head\)$'
      - run: docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5); print('readyz ok')"
      - name: basic-auth gate (placeholder hash is bcrypt of "change-me")
        run: |
          test "$(docker compose exec -T caddy sh -c 'curl -sk -o /dev/null -w "%{http_code}" --resolve cadence.ci.local:443:127.0.0.1 https://cadence.ci.local/')" = 401
          test "$(docker compose exec -T caddy sh -c 'curl -sk -o /dev/null -w "%{http_code}" -u cadence:change-me --resolve cadence.ci.local:443:127.0.0.1 https://cadence.ci.local/')" = 200
      - name: agent endpoints must not be gated
        run: |
          if docker compose exec -T caddy sh -c 'curl -sk -D - -o /dev/null -X POST --resolve cadence.ci.local:443:127.0.0.1 https://cadence.ci.local/api/v1/agent/next-job' | grep -qi '^www-authenticate:.*basic'; then
            echo "FAIL: /api/v1/agent/next-job is behind basic auth"; exit 1
          fi
      - name: security headers on the dashboard response
        run: |
          H=$(docker compose exec -T caddy sh -c 'curl -sk -D - -o /dev/null -u cadence:change-me --resolve cadence.ci.local:443:127.0.0.1 https://cadence.ci.local/')
          for want in \
            '^x-content-type-options: nosniff' \
            '^x-frame-options: DENY' \
            '^referrer-policy: no-referrer' \
            '^content-security-policy: .*frame-ancestors'; do
            echo "$H" | grep -qi "$want" || { echo "FAIL: missing header matching /$want/"; echo "$H"; exit 1; }
          done
          if echo "$H" | grep -qi '^server:'; then echo "FAIL: Server header leaked:"; echo "$H" | grep -i '^server:'; exit 1; fi
      - name: dump logs
        if: always()
        run: docker compose logs --tail=80 || true
      - name: tear down
        if: always()
        run: docker compose down -v || true

  # Single required-check surface. Green when every component job either passed
  # or was skipped; red if any executed job failed or was cancelled.
  gate:
    needs: [changes, agent, backend, frontend, scripts, stack]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check component results
        run: |
          python3 - <<'EOF'
          import json, sys
          needs = json.loads('''${{ toJSON(needs) }}''')
          results = {k: v["result"] for k, v in needs.items()}
          print(json.dumps(results, indent=2))
          bad = {k: r for k, r in results.items() if r not in ("success", "skipped")}
          if bad:
              print("FAIL:", bad)
              sys.exit(1)
          print("gate: OK")
          EOF
