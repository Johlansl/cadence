name: Release

# Tag-triggered. Two independent halves, one per tag namespace:
#   agent-v*  -> build the agent for amd64+arm64, attach to a GitHub Release
#   v*        -> build+push the backend/frontend images to GHCR, cut a Release
# Every artifact gets a Sigstore build-provenance attestation (no long-lived
# signing key touches CI -- the minisign fleet key stays on the central server;
# see docs/decisions.md "Release automation").

on:
  push:
    tags:
      - "v*"
      - "agent-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  agent-release:
    if: startsWith(github.ref_name, 'agent-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
      id-token: write # OIDC for the attestation
      attestations: write # write the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"

      - name: build agent binaries (amd64, arm64)
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#agent-v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p dist
          cd agent
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$a" go build -trimpath \
              -ldflags "-X main.agentVersion=$VER" \
              -o "../dist/cadence-agent-linux-$a" ./cmd/agent
          done
          cd ../dist
          for a in amd64 arm64; do
            sha256sum "cadence-agent-linux-$a" > "cadence-agent-linux-$a.sha256"
          done
          ./cadence-agent-linux-amd64 -version

      - name: build agent .deb (amd64, arm64)
        run: |
          set -eu
          mkdir -p dist/stage dist/units
          # The committed units target /usr/local (the curl|sh flow); a package
          # uses the FHS /usr paths.
          for u in cadence-agent.service cadence-agent.timer \
                   cadence-agent-poll.service cadence-agent-poll.timer; do
            sed -e 's#/usr/local/bin#/usr/bin#g' \
                -e 's#/usr/local/share/doc#/usr/share/doc#g' \
                "agent/systemd/$u" > "dist/units/$u"
          done
          for a in amd64 arm64; do
            cp "dist/cadence-agent-linux-$a" dist/stage/cadence-agent
            docker run --rm -e ARCH="$a" -e VER="$VER" -v "$PWD":/w -w /w \
              ghcr.io/goreleaser/nfpm:v2.47.0@sha256:a662cb167d7b6d3a83920c83d76b12d02b8ac5dd2c13e5c62c15270b23f6df0c \
              package -p deb -f packaging/nfpm.yaml \
              -t "dist/cadence-agent_${VER}-1_${a}.deb"
            ( cd dist && sha256sum "cadence-agent_${VER}-1_${a}.deb" \
                > "cadence-agent_${VER}-1_${a}.deb.sha256" )
          done
          ls -l dist/*.deb

      - name: provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/cadence-agent-linux-*
            dist/cadence-agent_*.deb

      - name: extract release notes
        run: |
          set -eu
          awk -v v="## $VER" '
            $0 == v {grab=1; next}
            /^## / && grab {exit}
            grab {print}
          ' agent/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "release.yml: no '## $VER' section in agent/CHANGELOG.md" >&2
            exit 1
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --title "agent $VER" \
            --notes-file notes.md \
            dist/cadence-agent-linux-amd64 \
            dist/cadence-agent-linux-amd64.sha256 \
            dist/cadence-agent-linux-arm64 \
            dist/cadence-agent-linux-arm64.sha256 \
            "dist/cadence-agent_${VER}-1_amd64.deb" \
            "dist/cadence-agent_${VER}-1_amd64.deb.sha256" \
            "dist/cadence-agent_${VER}-1_arm64.deb" \
            "dist/cadence-agent_${VER}-1_arm64.deb.sha256"

  server-images:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      packages: write # push to GHCR
      id-token: write # OIDC for the attestation
      attestations: write # write the attestation
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: derive version and guard it matches the source
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          bk=$(grep -oP '__version__ = "\K[^"]+' backend/app/__init__.py)
          fe=$(python3 -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          echo "tag=$VER  backend=$bk  frontend=$fe"
          [ "$VER" = "$bk" ] || { echo "release.yml: tag $VER != backend __version__ $bk" >&2; exit 1; }
          [ "$VER" = "$fe" ] || { echo "release.yml: tag $VER != frontend package.json $fe" >&2; exit 1; }

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/johlansl/cadence-${{ matrix.component }}:${{ env.VER }}
            ghcr.io/johlansl/cadence-${{ matrix.component }}:latest

      - name: provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/johlansl/cadence-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  server-release:
    if: startsWith(github.ref_name, 'v')
    needs: server-images
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: extract release notes
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          awk -v v="## $VER" '
            $0 == v {grab=1; next}
            /^## / && grab {exit}
            grab {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "release.yml: no '## $VER' section in CHANGELOG.md" >&2
            exit 1
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --title "v$VER" \
            --notes-file notes.md
